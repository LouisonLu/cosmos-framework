# Cosmos3 PwP Stage 2: masked RGB target + per-video target-loss mask.

[job]
task         = "vfm"
experiment   = "pwp_stage2_nano"
project      = "cosmos3"
group        = "pwp_stage2"
name         = "pwp_stage2_nano_target_loss_mask"
wandb_mode   = "disabled"

[model]
max_num_tokens_after_packing = 45056
joint_attn_implementation    = "two_way"
precision                    = "bfloat16"

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree      = -1
data_parallel_replicate_degree  = 1

[model.compile]
enabled         = true
compile_dynamic = true

[model.activation_checkpointing]
mode                = "full"
save_ops_regex      = ["fmha"]
preserve_rng_state  = true
determinism_check   = "default"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
betas          = [0.9, 0.95]
eps            = 1.0e-6
fused          = true
keys_to_select = ["moe_gen", "time_embedder", "vae2llm", "llm2vae"]
lr             = 1.0e-4
weight_decay   = 0

[scheduler]
# Match the recipe's 2000-step default. Shorter runs override this explicitly
# (for example scheduler.cycle_lengths=[1120]).
cycle_lengths      = [2000]
f_max              = [1.0]
f_min              = [0.0]
f_start            = [0.0]
verbosity_interval = 0
warm_up_steps      = [50]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter         = 1
logging_iter            = 1
max_iter                = 2000

[checkpoint]
keys_to_skip_loading = ["net_ema."]
load_path            = "${oc.env:PWP_STAGE2_CHECKPOINT_PATH}"
save_iter            = 250

[dataloader_train]
max_sequence_length = 45056
max_caption_tokens  = 2048
